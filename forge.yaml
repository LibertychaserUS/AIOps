schema: forge-config/v1
protect:
  - main
agent_branch_prefixes:
  - cursor/
  - copilot/
deny_paths:
  - .github/workflows/ci.yml
required_checks:
  - overlay-check
  - pr-title
  - forge-check
  - sop-lock
review:
  min_approvals: 1
  code_owners: false
ci:
  common:
    - pr-title
    - sop-lock
  products:
    overlay:
      check: overlay-check
      paths:
        - overlay/
        - suites/
        - inbox/
        - overlay.yaml
        - invariants.yaml
        - schema/
        - examples/
    forge:
      check: forge-check
      paths:
        - forge/
        - forge.yaml
  select:
    title:
      overlay:
        - overlay
      forge:
        - forge
      ci:
        - overlay
        - forge
      docs: []
