# Program-written overlay receipt. Not a Proctor ledger and not model output.
# select writes selected/dropped. run adds ran / skipped_no_command.
# ran events record exit, duration_s, and command_sha256.
# Proctor may ingest a copy locally; it must not write suite.yaml.

schema: overlay-receipt/v1
wrote_by: run                 # select | run  — never model
git_sha: pin-me
branch: main
at: 2026-09-10T00:00:00Z

events:
  - type: selected
    suite: checkout-retry
    status: active
    kind: functional
    function_id: FN-login-retry
    level: unit
  - type: ran
    suite: checkout-retry
    status: active
    function_id: FN-login-retry
    command: python -m unittest
    command_sha256: 3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
    exit: 0
    duration_s: 0.12
  - type: dropped
    suite: payment
    status: blocked
    rule: never_red_statuses
    reason: not ready; see OF-12
  - type: dropped
    suite: login
    status: blocked
    rule: never_red_statuses

evidence:
  - type: contract
    rule: blocked requires blocked_reason with a link or register id
