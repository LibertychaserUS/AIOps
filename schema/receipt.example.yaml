# Program-written overlay receipt. Not a Proctor ledger and not model output.
# select writes selected/dropped. run adds ran / skipped_no_command.
# Proctor may ingest a copy locally; it must not write suite.yaml.

schema: overlay-receipt/v1
wrote_by: run                 # select | run  — never model
git_sha: pin-me
branch: main
at: 2026-09-10T00:00:00Z

events:
  - type: selected
    suite: checkout-retry
    status: armed
    kind: functional
    function_id: FN-login-retry
    level: unit
  - type: ran
    suite: checkout-retry
    status: armed
    function_id: FN-login-retry
    command: python -m unittest
    exit_code: 0
  - type: dropped
    suite: payment
    status: blocked
    rule: never_red_statuses
  - type: dropped
    suite: login
    status: blocked
    rule: never_red_statuses

evidence:
  - type: human-review
    suite: checkout-retry
    reviewed_by: required-on-disk-in-suite.yaml
  - type: contract
    rule: missing reviewed_by on blocked|armed is overlay-red
