# Publish Overlay and Forge GitHub Releases. Not production CD.
# Human / Ops only: workflow_dispatch on main after a capstone merge.
# Never on push. Never generate. Never forge submit. Never merge.

name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without prefix (e.g. 1.0.1). Creates overlay-vX and/or forge-vX."
        required: true
        type: string
      products:
        description: "Which product tags to publish"
        required: true
        type: choice
        default: both
        options:
          - both
          - overlay
          - forge

permissions:
  contents: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        env:
          GOT_REF: ${{ github.ref }}
        run: |
          echo "release is dispatch-only on main (got $GOT_REF)"
          exit 1

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      # inputs go through env, never into the shell text: a crafted version
      # string must not become shell. forge release validates semver itself.
      - name: Publish product tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PRODUCTS: ${{ inputs.products }}
          RELEASE_SHA: ${{ github.sha }}
        run: >
          python -m forge release
          --repo "$RELEASE_REPO"
          --version "$RELEASE_VERSION"
          --products "$RELEASE_PRODUCTS"
          --sha "$RELEASE_SHA"
          --root .
