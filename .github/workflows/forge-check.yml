# Forge product gate. Common specs stay on ci.yml (pr-title + sop-lock).
# This workflow always starts (no on.paths). Selector skip is success so the
# required check name `forge-check` stays stable.
# When selected: Forge unit tests + apply --dry-run.
# Not the title gate. Not sop-lock. No live apply. No forge submit. No generate.

name: forge-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  forge-check:
    name: forge-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Select forge-check
        id: sel
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python -m forge ci-select --check forge-check --root . --github-output

      - name: Skip
        if: steps.sel.outputs.run != 'true'
        run: echo "selector skipped forge-check (${{ steps.sel.outputs.reason }})"

      - name: forge unit tests
        if: steps.sel.outputs.run == 'true'
        run: python3 -m unittest discover -s tests/forge -t . -q

      - name: forge apply --dry-run
        if: steps.sel.outputs.run == 'true'
        run: python3 -m forge apply --repo LibertychaserUS/AIOps --path forge.yaml --dry-run
