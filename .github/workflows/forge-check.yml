# Forge product gate. Common specs stay on ci.yml (pr-title + sop-lock).
# This workflow always starts (no on.paths). Selector skip is success so the
# required check name `forge-check` stays stable.
# When selected: forge check (deny_paths / suite_guard / docs_sync / pr spec +
# the full unittest discover) + apply --dry-run.
# Not the title gate. Not sop-lock. No live apply. No forge submit. No generate.

name: forge-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  forge-check:
    name: forge-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@v4
        with:
          # forge check diffs against origin/dev; shallow checkouts fail closed.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Select forge-check
        id: sel
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python -m forge ci-select --check forge-check --root . --github-output

      - name: Skip
        if: steps.sel.outputs.run != 'true'
        run: echo "selector skipped forge-check (${{ steps.sel.outputs.reason }})"

      # Same checklist as the local 代推锁. pull_request lints PR_TITLE / PR_BODY;
      # push lints the HEAD subject. Runs `unittest discover -s tests -t .`,
      # which covers tests/forge (no separate Forge-only discover step).
      - name: forge check
        if: steps.sel.outputs.run == 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 -m forge check --root .

      - name: forge apply --dry-run
        if: steps.sel.outputs.run == 'true'
        run: python3 -m forge apply --repo ${{ github.repository }} --path forge.yaml --dry-run

      - name: forge status --check-state
        run: python -m forge status --root . --repo ${{ github.repository }} --check-state
