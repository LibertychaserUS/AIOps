# Workshop common checks only. 通用检查 ≠ 产品门.
# Jobs named pr-title + sop-lock (stable for Ruleset / forge.yaml).
# Forge product door stays in forge-check.yml.
# Overlay product door + Ops DAG stays in overlay-check.yml.
# Adopters pin reusable overlay.yml — do not copy this workshop ci.yml.
# release.yml is human publish, not CI.
# Skip via ci-select is a product-door concern; these two jobs always run.

name: ci

on:
  push:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python -m forge pr-title --root .

  sop-lock:
    name: sop-lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: sop-lock
        run: python -m forge sop-lock --root .
