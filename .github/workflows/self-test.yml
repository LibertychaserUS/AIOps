# Tests THIS repo's Overlay against examples/learning-guide.
# Does not test a product build. Does not workflow_call product ci.yml.
# No secrets. Token never on push. generate does not exist.

name: self-test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  overlay-cli:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: schema/check.py
        run: python schema/check.py

      - name: module entry points
        run: |
          python -m overlay --help
          python -m overlay validate --help
          python -m overlay select --help

      - name: unit tests
        run: python -m unittest discover -s tests -t . -v

  overlay-fixture:
    uses: ./.github/workflows/overlay.yml
    with:
      enable_run: false
      root: examples/learning-guide
      branch: main
