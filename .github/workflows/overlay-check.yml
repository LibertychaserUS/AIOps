# This workshop uses Overlay on itself (local overlay/ is correct here only).
# Adopters must not copy overlay/ — they uses: overlay.yml from the tool repo.
# Overlay test and CI are the same gate: validate + select + run Overlay armed
# product_command only. Forge tests live on forge-check, not this run.
# No generate. No product Verify. branch is pinned to main so agent branches
# still execute the armed Overlay tool tests.
# Learning Guide fixture stays Overlay-only preview/skip — no foreign product checkout.

name: overlay-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  overlay:
    uses: ./.github/workflows/overlay.yml
    with:
      enable_run: true
      root: "."
      branch: main
      receipt_prefix: workshop

  fixture:
    uses: ./.github/workflows/overlay.yml
    with:
      enable_run: true
      root: examples/learning-guide
      branch: main
      receipt_prefix: lg-fixture
