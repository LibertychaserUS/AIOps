# Common PR-title check. Always runs on pull_request. Never skipped.
# Same function as local `python -m forge pr-title`.
# Title is a repo-wide spec, not a Forge product gate.
# Check name is the job name `pr-title` (stable for Ruleset required_checks).
# No GitHub write. No model. No husky/npm.

name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python -m forge pr-title --root .
