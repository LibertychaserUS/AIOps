schema: forge-config/v1
protect:
  - main
agent_branch_prefixes:
  - cursor/
  - copilot/
deny_paths:
  - .github/workflows/ci.yml
# required_checks = GitHub check / job names as they appear on a PR, not the
# workflow `name:` unless those strings are identical. This example uses
# `Verify` because the sample job is called that. Learning Guide uses
# `Typecheck`, `Lint`, `Build and test`, `overlay-check`.
required_checks:
  - Verify
review:
  min_approvals: 1
  code_owners: false
ci:
  common:
    - pr-title
    - sop-lock
  products:
    overlay:
      check: overlay-check
      paths:
        - overlay.yaml
        - inbox/
        - suites/
        - invariants.yaml
    forge:
      check: forge-check
      paths:
        - forge.yaml
