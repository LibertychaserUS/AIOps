schema: forge-config/v1
protect:
  - dev
  - main
agent_branch_prefixes:
  - cursor/
  - copilot/
  - agent/
deny_paths:
  - .github/workflows/
# required_checks = GitHub check / job names as they appear on a PR, not the
# workflow `name:` unless those strings are identical.
branches:
  dev:
    required_checks:
      - unit
      - lint
    approvals: 0
    code_owners: false
  main:
    required_checks:
      - unit
      - lint
      - overlay-check
    approvals: 1
    code_owners: true
    promote_from: dev
title:
  scopes: any
docs_sync: []
forbidden_live_repos: []
ci:
  common:
    - pr-title
    - sop-lock
  products:
    overlay:
      check: overlay-check
      paths:
        - overlay.yaml
        - inbox/
        - suites/
        - invariants.yaml
    forge:
      check: forge-check
      paths:
        - forge.yaml
