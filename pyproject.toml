[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "aiops"
version = "0.1.0"
description = "Forge + Overlay. This slice ships Overlay validate/select."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0.1,<7",
]

[project.scripts]
overlay = "overlay.__main__:main"
forge = "forge.__main__:main"

[tool.setuptools.packages.find]
include = ["overlay", "forge"]
